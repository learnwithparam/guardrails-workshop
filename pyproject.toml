[project]
name = "marrowfield-desk"
version = "1.0.0"
description = "Guard the purchasing desk: a guardrails workshop on Marrowfield Kitchens' supplier inbox."
requires-python = ">=3.11"
dependencies = [
    "litellm==1.109.1",
]

[project.scripts]
world = "marrowfield.cli:world_main"
desk = "marrowfield.cli:desk_main"
models = "marrowfield.cli:models_main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["world/marrowfield", "config"]

# Python follows the same readable-code rules as TypeScript. See STANDARD.md, "Readable code".
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "C90", "PLR0913", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-nested-blocks = 3
