<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchasing desk</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --muted: #646a73; --line: #e2e0d8;
  --allow: #1f7a4d; --allow-bg: #e6f4ec; --ask: #8a5a00; --ask-bg: #fff3d6;
  --deny: #b3261e; --deny-bg: #fde8e6; --accent: #2c5d8f; --bar: #e9e7e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e6e1; --muted: #9aa0a8; --line: #2e3238;
    --allow: #6fd19b; --allow-bg: #173526; --ask: #f0c060; --ask-bg: #3a2f14;
    --deny: #ff8a80; --deny-bg: #3d1c1a; --accent: #8fb8e6; --bar: #2a2e33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
header .desk { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bar); color: var(--muted); }
main { display: grid; grid-template-columns: 280px 1fr 340px; gap: 14px; padding: 14px 20px; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.mail { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 8px; border-radius: 8px; cursor: pointer; font: inherit; }
.mail:hover { background: var(--bar); }
.mail.on { background: var(--bar); outline: 1px solid var(--line); }
.mail b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.mail span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height: 420px; overflow: auto; margin: 0 0 10px; }
button.run { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.v { font-size: 11px; font-weight: 600; text-transform: uppercase; text-align: center; border-radius: 6px; padding: 2px 0; align-self: start; }
.v.allow, .v.approve, .v.approved { color: var(--allow); background: var(--allow-bg); }
.v.ask, .v.review { color: var(--ask); background: var(--ask-bg); }
.v.deny, .v.block, .v.blocked { color: var(--deny); background: var(--deny-bg); }
.call { font: 12.5px ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
.why { color: var(--muted); font-size: 12px; }
.note { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 13px; }
.note.bad { background: var(--deny-bg); color: var(--deny); }
.note.good { background: var(--allow-bg); color: var(--allow); }
.note.held { background: var(--ask-bg); color: var(--ask); }
.layer { margin-bottom: 12px; }
.layer .name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.row { display: grid; grid-template-columns: 112px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin: 3px 0; }
.track { height: 9px; background: var(--bar); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; }
.fill.sec { background: var(--accent); } .fill.ut { background: var(--allow); }
.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.ledger { font-size: 12.5px; margin: 0; padding-left: 16px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header><h1>Marrowfield Kitchens · Purchasing desk</h1><span class="desk" id="desk">loading</span></header>
<main>
  <section><h2>Supplier inbox</h2><div id="inbox"></div></section>
  <section>
    <h2>The desk's run</h2>
    <div id="email" class="muted">Pick an email on the left.</div>
    <div id="run"></div>
  </section>
  <section>
    <h2>Scoreboard</h2>
    <div id="score" class="muted">Scoring 48 planted attacks and 60 real emails...</div>
    <h2 style="margin-top:16px">Ledger for this email</h2>
    <div id="ledger" class="muted">Nothing yet.</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => Math.round(x * 100) + "%";
let current = null;

async function load() {
  const s = await (await fetch("/api/state")).json();
  $("desk").textContent = s.desk;
  $("inbox").innerHTML = s.inbox.map((m) =>
    `<button class="mail" data-id="${m.id}"><b>${m.id} · ${esc(m.name || m.from)}</b><span>${esc(m.subject)}</span></button>`).join("");
  document.querySelectorAll(".mail").forEach((b) => b.onclick = () => pick(b.dataset.id));
  const q = new URLSearchParams(location.search);
  if (q.get("email")) { await pick(q.get("email")); if (q.get("run")) await run(); }
  score();
}

async function pick(id) {
  current = id;
  document.querySelectorAll(".mail").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  const e = await (await fetch("/api/email/" + id)).json();
  $("email").innerHTML = `<pre>${esc(e.view)}</pre><button class="run" id="go">Run the desk on ${id}</button>`;
  $("go").onclick = run;
  $("run").innerHTML = "";
  $("ledger").textContent = "Nothing yet.";
}

function verdictRow(v, title, why) {
  return `<li><span class="v ${v}">${esc(v)}</span><div><div class="call">${title}</div>${why ? `<div class="why">${esc(why)}</div>` : ""}</div></li>`;
}

async function run() {
  $("run").innerHTML = '<p class="muted">Running...</p>';
  const r = await (await fetch("/desk/handle", { method: "POST", body: JSON.stringify({ email_id: current }) })).json();
  const items = [];
  const input = r.decisions.find((d) => d.layer === "input");
  if (input && !(input.decision === "allow" && /no input guard/.test(input.reason)))
    items.push(verdictRow(input.decision, "input guard: " + esc(input.rule), input.reason));
  const outputs = r.decisions.filter((d) => d.layer === "output" && d.decision !== "allow");
  for (const a of r.actions) {
    const args = Object.entries(a.args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
    const why = a.rule && a.rule !== "none" ? `${a.rule}: ${a.reason}` : "";
    items.push(verdictRow(a.verdict, `${esc(a.tool)}(${esc(args.length > 140 ? args.slice(0, 140) + "..." : args)})`, why));
  }
  for (const o of outputs) items.push(verdictRow(o.decision, "output guard: " + esc(o.rule), o.reason));
  let note = "";
  if (r.forbidden.length) note = `<div class="note bad">Forbidden change in the records: ${r.forbidden.map((f) => esc(f.kind)).join(", ")}</div>`;
  else if (r.held) note = `<div class="note held">Held for a person: ${esc(r.held_reasons.join("; "))}</div>`;
  else note = `<div class="note good">No forbidden change. ${r.changes.length ? "" : "Nothing changed."}</div>`;
  $("run").innerHTML = `<ul class="steps">${items.join("") || '<li class="muted">No tool calls.</li>'}</ul>${note}`;
  $("ledger").innerHTML = r.changes.length
    ? `<ul class="ledger">${r.changes.map((c) => `<li>${esc(c.kind)} ${esc(Object.entries(c).filter(([k]) => k !== "kind").map(([k, v]) => `${k} ${v}`).join(", "))}</li>`).join("")}</ul>`
    : '<span class="muted">No change to the records.</span>';
}

function bars(name, s, u) {
  return `<div class="layer"><div class="name">${esc(name)}</div>
    <div class="row"><span>attacks stopped</span><div class="track"><div class="fill sec" style="width:${pct(s.rate)}"></div></div><span class="num">${s.stopped} of ${s.n}</span></div>
    <div class="row"><span>good work through</span><div class="track"><div class="fill ut" style="width:${pct(u.rate)}"></div></div><span class="num">${u.passed} of ${u.n}</span></div></div>`;
}

async function score() {
  const s = await (await fetch("/api/score")).json();
  const rows = s.by_layer && s.by_layer.length ? s.by_layer : [{ layer: "this desk", security: s.security, utility: s.utility }];
  $("score").innerHTML = rows.map((r) => bars(r.layer, r.security, r.utility)).join("");
  $("score").classList.remove("muted");
}
load();
</script>
</body>
</html>
