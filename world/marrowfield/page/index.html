<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchasing desk</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --muted: #646a73; --line: #e2e0d8;
  --allow: #1f7a4d; --allow-bg: #e6f4ec; --ask: #8a5a00; --ask-bg: #fff3d6;
  --deny: #b3261e; --deny-bg: #fde8e6; --accent: #2c5d8f; --bar: #e9e7e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e6e1; --muted: #9aa0a8; --line: #2e3238;
    --allow: #6fd19b; --allow-bg: #173526; --ask: #f0c060; --ask-bg: #3a2f14;
    --deny: #ff8a80; --deny-bg: #3d1c1a; --accent: #8fb8e6; --bar: #2a2e33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
header .desk { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bar); color: var(--muted); }
main { display: grid; grid-template-columns: 280px 1fr 340px; gap: 14px; padding: 14px 20px; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.mail { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; text-decoration: none; padding: 8px; border-radius: 8px; cursor: pointer; font: inherit; box-sizing: border-box; }
.mail:hover { background: var(--bar); }
.mail.on { background: var(--bar); outline: 1px solid var(--line); }
.mail b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.mail span { display: block; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height: 420px; overflow: auto; margin: 0 0 10px; }
button.run { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.v { font-size: 11px; font-weight: 600; text-transform: uppercase; text-align: center; border-radius: 6px; padding: 2px 0; align-self: start; }
.v.allow, .v.approve, .v.approved { color: var(--allow); background: var(--allow-bg); }
.v.ask, .v.review { color: var(--ask); background: var(--ask-bg); }
.v.deny, .v.block, .v.blocked { color: var(--deny); background: var(--deny-bg); }
.call { font: 12.5px ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
.why { color: var(--muted); font-size: 12px; }
.note { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 13px; }
.note.bad { background: var(--deny-bg); color: var(--deny); }
.note.good { background: var(--allow-bg); color: var(--allow); }
.note.held { background: var(--ask-bg); color: var(--ask); }
.layer { margin-bottom: 12px; }
.layer .name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.row { display: grid; grid-template-columns: 112px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin: 3px 0; }
.track { height: 9px; background: var(--bar); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; }
.fill.sec { background: var(--accent); } .fill.ut { background: var(--allow); }
.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.ledger { font-size: 12.5px; margin: 0; padding-left: 16px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header><h1>Marrowfield Kitchens · Purchasing desk</h1><span class="desk" id="desk">Loading the desk</span></header>
<main>
  <section><h2>Supplier inbox</h2><div id="inbox"></div></section>
  <section>
    <h2>The desk's run</h2>
    <div id="email" class="muted">Pick an email from the inbox.</div>
    <div id="run"></div>
  </section>
  <section>
    <h2>Scoreboard</h2>
    <div id="score" class="muted">Scoring 48 planted attacks and 60 real emails</div>
    <h2 style="margin-top:16px">Ledger for this email</h2>
    <div id="ledger" class="muted">Nothing yet.</div>
  </section>
</main>
<script>
// Short helpers the page uses everywhere.
const byId = (id) => document.getElementById(id);
const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
const escapeHtml = (text) =>
  String(text ?? "").replace(/[&<>"]/g, (character) => HTML_ESCAPES[character]);
const percent = (fraction) => `${Math.round(fraction * 100)}%`;
let currentEmailId = null;

async function getJson(url, options) {
  const response = await fetch(url, options);
  return response.json();
}

function inboxButton(email) {
  const sender = escapeHtml(email.name || email.from);
  return `<a class="mail" href="?email=${email.id}" data-id="${email.id}"><b>${email.id} · ${sender}</b><span>${escapeHtml(email.subject)}</span></a>`;
}

async function load() {
  const state = await getJson("/api/state");
  byId("desk").textContent = state.desk;
  byId("inbox").innerHTML = state.inbox.map(inboxButton).join("");
  for (const button of document.querySelectorAll(".mail")) {
    button.onclick = (event) => {
      event.preventDefault();
      pick(button.dataset.id);
    };
  }
  // A link like ?email=MK-07&run=1 opens that email, and runs it too.
  const query = new URLSearchParams(location.search);
  if (query.get("email")) {
    await pick(query.get("email"));
    if (query.get("run")) await run();
  }
  score();
}

async function pick(id) {
  currentEmailId = id;
  for (const button of document.querySelectorAll(".mail")) {
    button.classList.toggle("on", button.dataset.id === id);
  }
  const email = await getJson(`/api/email/${id}`);
  byId("email").innerHTML =
    `<pre>${escapeHtml(email.view)}</pre><button class="run" id="go">Run the desk on ${id}</button>`;
  byId("go").onclick = run;
  byId("run").innerHTML = "";
  byId("ledger").textContent = "Nothing yet.";
}

function verdictRow(verdict, title, why) {
  const whyLine = why ? `<div class="why">${escapeHtml(why)}</div>` : "";
  return `<li><span class="v ${verdict}">${escapeHtml(verdict)}</span><div><div class="call">${title}</div>${whyLine}</div></li>`;
}

function actionRow(action) {
  const pairs = Object.entries(action.args).map(([name, value]) => `${name}=${JSON.stringify(value)}`);
  const args = pairs.join(", ");
  const why = action.rule && action.rule !== "none" ? `${action.rule}: ${action.reason}` : "";
  return verdictRow(action.verdict, `${escapeHtml(action.tool)}(${escapeHtml(args)})`, why);
}

// One row per guard verdict: the input guard, each tool call, then each output guard that acted.
function stepRows(result) {
  const rows = [];
  const input = result.decisions.find((decision) => decision.layer === "input");
  const inputDidNothing = input && input.decision === "allow" && /no input guard/.test(input.reason);
  if (input && !inputDidNothing) {
    rows.push(verdictRow(input.decision, `input guard: ${escapeHtml(input.rule)}`, input.reason));
  }
  for (const action of result.actions) rows.push(actionRow(action));
  const outputs = result.decisions.filter(
    (decision) => decision.layer === "output" && decision.decision !== "allow",
  );
  for (const output of outputs) {
    rows.push(verdictRow(output.decision, `output guard: ${escapeHtml(output.rule)}`, output.reason));
  }
  return rows;
}

function resultNote(result) {
  if (result.forbidden.length) {
    const kinds = result.forbidden.map((change) => escapeHtml(change.kind)).join(", ");
    return `<div class="note bad">The email led to a change the policy does not allow: ${kinds}</div>`;
  }
  if (result.held) {
    return `<div class="note held">Held for a person: ${escapeHtml(result.held_reasons.join("; "))}</div>`;
  }
  const nothing = result.changes.length ? "" : "Nothing changed.";
  return `<div class="note good">No change the policy does not allow. ${nothing}</div>`;
}

function ledgerRow(change) {
  const details = Object.entries(change)
    .filter(([name]) => name !== "kind")
    .map(([name, value]) => `${name} ${value}`)
    .join(", ");
  return `<li>${escapeHtml(change.kind)} ${escapeHtml(details)}</li>`;
}

async function run() {
  byId("run").innerHTML = '<p class="muted">The desk is working on this email</p>';
  // biome-ignore lint/style/useNamingConvention: the server reads the key email_id.
  const body = JSON.stringify({ email_id: currentEmailId });
  const result = await getJson("/desk/handle", { method: "POST", body });
  const steps = stepRows(result).join("") || '<li class="muted">No tool calls.</li>';
  byId("run").innerHTML = `<ul class="steps">${steps}</ul>${resultNote(result)}`;
  if (result.changes.length) {
    byId("ledger").innerHTML = `<ul class="ledger">${result.changes.map(ledgerRow).join("")}</ul>`;
  } else {
    byId("ledger").innerHTML = '<span class="muted">No change to the records.</span>';
  }
}

function bars(name, security, utility) {
  return `<div class="layer"><div class="name">${escapeHtml(name)}</div>
    <div class="row"><span>attacks stopped</span><div class="track"><div class="fill sec" style="width:${percent(security.rate)}"></div></div><span class="num">${security.stopped} of ${security.n}</span></div>
    <div class="row"><span>good work through</span><div class="track"><div class="fill ut" style="width:${percent(utility.rate)}"></div></div><span class="num">${utility.passed} of ${utility.n}</span></div></div>`;
}

async function score() {
  const scoreboard = await getJson("/api/score");
  const thisDesk = { layer: "this desk", security: scoreboard.security, utility: scoreboard.utility };
  const rows = scoreboard.by_layer?.length ? scoreboard.by_layer : [thisDesk];
  byId("score").innerHTML = rows.map((row) => bars(row.layer, row.security, row.utility)).join("");
  byId("score").classList.remove("muted");
}

load();
</script>
</body>
</html>
